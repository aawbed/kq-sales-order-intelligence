{% extends "base.html" %}
{% block title %}Page Not Found — KQ Intelligence{% endblock %}

{% block sidebar %}{% endblock %}

{% block content %}
<div class="d-flex align-items-center justify-content-center" style="min-height: calc(100vh - var(--header-height) - 8rem);">
    <div class="text-center stagger-fade">
        <div class="d-inline-flex align-items-center justify-content-center rounded-3 mb-3"
             style="width: 64px; height: 64px; background: var(--kq-warning-bg, #fef3c7);">
            <i class="bi bi-compass" style="color: #d97706; font-size: 1.8rem;"></i>
        </div>
        <h4 class="fw-bold">404 — Page Not Found</h4>
        <p class="text-muted mb-4" style="max-width: 400px;">
            The requested resource could not be found or may have been moved.
        </p>
        <a href="{% url 'home' %}" class="btn btn-dark">
            <i class="bi bi-house me-1"></i> Return to Workspace
        </a>
    </div>
</div>
{% endblock %}
